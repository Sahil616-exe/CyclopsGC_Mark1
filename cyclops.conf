# Cyclops web tier. Replace __DOMAIN__ and __APP_IP__ (certbot adds the HTTPS block and the redirect).
# Only login endpoints are rate limited (10 per minute per visitor); everything else has an empty key = no limit.
map $uri $cyc_limit { default ""; ~^/api/(auth/|admin/login) $binary_remote_addr; }
limit_req_zone $cyc_limit zone=cyc_login:10m rate=10r/m;

server {
    listen 80;
    server_name __DOMAIN__;
    root /var/www/cyclops;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;   # needed by the Google sign-in popup

    location /img/ { expires 30d; }
    location /css/ { expires 1h; }
    location /js/  { expires 1h; }
    location /     { try_files $uri /index.html; }

    location /api/ {
        limit_req zone=cyc_login burst=10 nodelay;
        proxy_pass http://__APP_IP__:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
